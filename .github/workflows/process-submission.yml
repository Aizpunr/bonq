name: Process submitted cups
on:
  schedule:
    - cron: '*/15 18-23 * * 0'
    - cron: '*/15 0-11 * * 1'
  push:
    branches: [main]
    paths: ['cups/**']
  workflow_dispatch:
    inputs:
      id:
        description: Only this submission id (optional)
        required: false
        type: string
      dry_run:
        description: Decide and log without changes
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: submissions
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      BONQ_WORKER_URL: ${{ secrets.BONQ_WORKER_URL }}
      BONQ_POLLER_TOKEN: ${{ secrets.BONQ_POLLER_TOKEN }}
      BONQ_PLAYERS_JSON: ${{ github.workspace }}/cotd/players.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aizpunr/Zeepkist-COTD-Elo-Rankings
          path: cotd
          sparse-checkout: players.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install pytest
      - name: Tests
        run: if [ -d tests ]; then python -m pytest -q tests; fi
      - name: Poll and process
        env:
          ONLY_ID: ${{ inputs.id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--once --ci -v)
          if [ -n "$ONLY_ID" ]; then args+=(--id "$ONLY_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python submissions_poll.py "${args[@]}"
      - name: Keep poll log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submissions-${{ github.run_id }}
          path: poll.log
          if-no-files-found: ignore
          retention-days: 30
